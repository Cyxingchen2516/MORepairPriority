; ============================================================================
; MORepairPriority - 维修单位优先修残血友军
; ============================================================================
[RepairPriority]
Enable=1
; 扫描间隔(逻辑帧)。1 = 每帧都扫描
Interval=1
; 取不到武器射程时的回退半径(格)
RadiusCells=6
; 新目标血量百分比至少低这么多才换(防抖; 仅 Mode=lowest 时生效)
Hysteresis=3
; lowest  = 优先修血量百分比最低的友军 (发 Attack, 会停下瞄准)
; nearest = 优先修最近的残血友军 (发 AttackMove, 边移动边修, 与原版移动攻击一致)
Mode=nearest
; 目标范围: 只看当前选中的编队; 默认地面载具, 医生IFV修步兵时锁步兵
EngineerTypes=
Log=1
